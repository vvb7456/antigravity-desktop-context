<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下文监控</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #8e959e;
    --c-user: #60a5fa;
    --c-agent: #3b82f6;
    --c-tool: #f59e0b;
    --c-custom: #a78bfa;
    --c-sysmsg: #f87171;
    --c-think: #c084fc;
    --c-good: #34d399;
    --c-warn: #fbbf24;
    --c-bad: #f87171;
    --fg: var(--foreground, #e5e7eb);
    --dim: var(--muted-foreground, #9ca3af);
    --line: var(--border, color-mix(in srgb, var(--fg) 10%, transparent));
    --line-soft: color-mix(in srgb, var(--fg) 6.5%, transparent);
    --surface: color-mix(in srgb, var(--fg) 3.5%, transparent);
    --surface-2: color-mix(in srgb, var(--fg) 6%, transparent);
    --track: color-mix(in srgb, var(--fg) 9%, transparent);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 12.5px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 28%, transparent);
    border: 2px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 50%, transparent); }

  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }
  .good { color: var(--c-good); }
  .warn { color: var(--c-warn); }
  .bad { color: var(--c-bad); }

  /* 通用极简微标 */
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10.5px; line-height: 1.45; padding: 0 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .tag.warn {
    color: var(--c-warn);
    border-color: color-mix(in srgb, var(--c-warn) 38%, transparent);
    background: color-mix(in srgb, var(--c-warn) 10%, transparent);
  }
  .tag.good {
    color: var(--c-good);
    border-color: color-mix(in srgb, var(--c-good) 35%, transparent);
    background: color-mix(in srgb, var(--c-good) 9%, transparent);
  }
  .tag.bad {
    color: var(--c-bad);
    border-color: color-mix(in srgb, var(--c-bad) 40%, transparent);
    background: color-mix(in srgb, var(--c-bad) 10%, transparent);
  }

  /* 顶部极简头栏 */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .header-info { min-width: 0; flex: 1; }
  .model-line { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
  .model-line .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--track); flex: none; }
  .live.on { background: var(--c-good); }
  .upstream-line {
    margin-top: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    font-size: 11px; color: var(--dim);
  }
  .upstream-code {
    font-family: var(--mono); font-size: 10.5px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .upstream-code.routed { color: var(--c-warn); }

  button.ghost-btn {
    font: inherit; font-size: 11px; color: var(--dim); cursor: pointer; white-space: nowrap; flex: none;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
    transition: color .15s, border-color .15s, background .15s;
  }
  button.ghost-btn:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 24%, transparent); background: var(--surface); }
  button.ghost-btn:disabled { opacity: .45; cursor: default; }

  /* 顶部双分段切换（彻底分离「当前会话」与「账号额度」） */
  .tabs {
    margin-top: 11px; padding: 3px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line-soft);
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
  }
  .tab {
    font: inherit; font-size: 11.5px; font-weight: 500; color: var(--dim);
    background: transparent; border: none; border-radius: 6px; padding: 5px 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, color .15s, box-shadow .15s; min-width: 0;
  }
  .tab:hover { color: var(--fg); }
  .tab.active {
    background: var(--surface-2); color: var(--fg); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .14);
  }
  .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .tab-num { font-size: 11px; font-weight: 600; }

  /* 仅在额度告急（<=20%）时出现在会话页顶部的轻量单行提醒 */
  .quota-alert {
    margin-top: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11.5px; border: 1px solid color-mix(in srgb, var(--c-bad) 40%, transparent);
    background: color-mix(in srgb, var(--c-bad) 9%, transparent); color: var(--fg);
  }
  .quota-alert.warn {
    border-color: color-mix(in srgb, var(--c-warn) 42%, transparent);
    background: color-mix(in srgb, var(--c-warn) 9%, transparent);
  }
  .quota-alert .qa-link { font-size: 11px; color: var(--dim); white-space: nowrap; }

  /* ======== 视图一：当前会话 ======== */
  .hero-block { margin-top: 14px; }
  .hero-usage { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .hero-nums { display: flex; align-items: baseline; gap: 5px; }
  .hero-big { font-size: 26px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
  .hero-of { font-size: 12.5px; color: var(--dim); }
  .hero-pct { font-size: 14px; font-weight: 600; }

  .bar-wrap { position: relative; margin-top: 10px; padding: 2px 0; }
  .bar {
    display: flex; width: 100%; height: 8px; border-radius: 999px;
    background: var(--track); overflow: hidden; gap: 1px;
  }
  .bar-seg { height: 100%; min-width: 2px; transition: width .25s ease; }
  .budget-marker {
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--fg); opacity: .8; border-radius: 1px; transform: translateX(-1px);
  }
  .bar-meta {
    margin-top: 6px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 11px; color: var(--dim); flex-wrap: wrap;
  }

  /* 一体化 2x2 指标面板（发丝内分割线，告别 4 个零碎小盒子） */
  .kpi-grid {
    margin-top: 14px; border-radius: 9px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line-soft);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi-cell { padding: 9px 11px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kpi-cell:nth-child(odd) { border-right: 1px solid var(--line-soft); }
  .kpi-cell:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .kpi-k { font-size: 11px; color: var(--dim); display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .kpi-v { font-size: 16px; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 3px; }
  .kpi-v .unit { font-size: 10.5px; font-weight: 500; color: var(--dim); }
  .kpi-sub { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-bar { margin-top: 3px; height: 3px; border-radius: 999px; background: var(--track); overflow: hidden; display: flex; gap: 1px; }

  /* 轻量化内容分区（使用发丝分隔线 + 清晰留白，而非满屏卡片边框） */
  .sec { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
  .sec-head {
    font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: .02em;
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .sec-head .hint { font-weight: 400; font-size: 11px; }
  .note { font-size: 11.5px; color: var(--dim); margin: -2px 0 8px; }

  /* 上下文分类构成（紧凑单行） */
  .cat-group + .cat-group { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line-soft); }
  .cat-row {
    display: grid; grid-template-columns: 8px 1fr auto 42px;
    align-items: center; gap: 7px; padding: 2px 0;
  }
  .mark { width: 7px; height: 7px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid color-mix(in srgb, var(--dim) 45%, transparent); }
  .cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-tok { text-align: right; font-weight: 500; }
  .cat-pct { text-align: right; color: var(--dim); font-size: 11.5px; }

  /* 多模型分流列表 */
  .route-list { display: flex; flex-direction: column; gap: 6px; }
  .route-row { display: flex; flex-direction: column; gap: 2px; padding: 5px 8px; border-radius: 6px; background: var(--surface); }
  .route-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .route-model { font-family: var(--mono); font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .route-sub { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--dim); flex-wrap: wrap; }

  /* 极简分割线折叠行（无多余外框） */
  details.fold { margin-top: 14px; border-top: 1px solid var(--line-soft); }
  details.fold > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 10px 2px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11.5px; font-weight: 600; color: var(--dim);
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary:hover { color: var(--fg); }
  details.fold > summary .sum-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
  details.fold > summary .chev {
    display: inline-block; width: 0; height: 0; flex: none;
    border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; border-left: 4.5px solid currentColor;
    transition: transform .15s ease; opacity: .75;
  }
  details.fold[open] > summary .chev { transform: rotate(90deg); }
  details.fold > summary .sum-right { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 11px; }
  .fold-body { padding: 4px 2px 4px; }

  /* 逐轮调用流水表 */
  .turns { display: flex; flex-direction: column; }
  .turn-head, .turn-row {
    display: grid; grid-template-columns: 28px 1fr 48px 46px 54px;
    align-items: center; gap: 6px; padding: 4px 3px;
  }
  .turn-head { font-size: 10.5px; color: var(--dim); border-bottom: 1px solid var(--line-soft); padding-bottom: 5px; }
  .turn-row { font-size: 11px; border-bottom: 1px solid color-mix(in srgb, var(--line-soft) 75%, transparent); }
  .turn-row:last-child { border-bottom: none; }
  .turn-row.drop {
    background: color-mix(in srgb, var(--c-bad) 8%, transparent);
    border-left: 2px solid var(--c-bad); padding-left: 5px; border-radius: 3px;
  }
  .turn-row .t-model { font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn-head .r, .turn-row .r { text-align: right; }

  /* 检查点与文件 */
  .ck-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-size: 12px; }
  .ck-sub { margin-top: 4px; font-size: 11px; color: var(--dim); }
  .file-group { margin-top: 8px; }
  .file-group:first-child { margin-top: 2px; }
  .file-group-title { font-size: 10.5px; font-weight: 600; color: var(--dim); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .files { list-style: none; margin: 0; padding: 0; }
  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; }
  .files .fname { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .fdir { display: block; font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .ftok { color: var(--dim); font-size: 11px; align-self: start; }

  /* ======== 视图二：账号额度专属视图 ======== */
  .q-toolbar {
    margin-top: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .q-toolbar-left { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); min-width: 0; }
  .q-hero {
    margin-top: 10px; padding: 12px 13px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .q-hero.warn {
    border-color: color-mix(in srgb, var(--c-warn) 45%, transparent);
    background: color-mix(in srgb, var(--c-warn) 7%, var(--surface));
  }
  .q-hero.bad {
    border-color: color-mix(in srgb, var(--c-bad) 52%, transparent);
    background: color-mix(in srgb, var(--c-bad) 9%, var(--surface));
  }
  .q-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-hero-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-hero-num-row { margin-top: 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .q-hero-big { font-size: 28px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
  .q-reset-pill {
    font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap;
  }
  .q-hero-bar { margin-top: 10px; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .q-hero-bar > div { height: 100%; border-radius: 999px; transition: width .25s ease; }

  .q-buckets { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 7px; }
  .q-bucket-row { display: flex; flex-direction: column; gap: 3px; }
  .q-bucket-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
  .q-bucket-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .q-bucket-bar > div { height: 100%; border-radius: 999px; }

  .q-other-list { display: flex; flex-direction: column; gap: 10px; }
  .q-pool-row { display: flex; flex-direction: column; gap: 4px; }
  .q-pool-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-pool-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .q-pool-pct { font-size: 12.5px; font-weight: 650; flex: none; }
  .q-pool-bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .q-pool-bar > div { height: 100%; border-radius: 999px; }
  .q-pool-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }

  .empty { margin: 56px 12px; text-align: center; color: var(--dim); font-size: 12.5px; }
  footer {
    margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line-soft);
    font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
</style>
</head>
<body>
<main id="main"><p class="empty">正在读取会话数据…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const QUOTA_POLL_MS = 5 * 60 * 1000;
  const SEGMENT_META = [
    { label: '系统提示与内置工具', color: 'var(--c-system)' },
    { label: '用户消息', color: 'var(--c-user)' },
    { label: '助手回复', color: 'var(--c-agent)' },
    { label: '工具调用', color: 'var(--c-tool)' },
    { label: '规则、技能与扩展', color: 'var(--c-custom)' },
  ];
  const CONVERSATION = { user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)', system_messages: 'var(--c-sysmsg)' };
  const SYSTEM = new Set(['system_prompt', 'system_tools', 'system_overhead']);
  const CATEGORY_LABELS = {
    user: '用户消息',
    agent: '助手回复',
    tool: '工具调用',
    system_prompt: '系统提示词',
    system_tools: '内置工具定义',
    system_overhead: '系统开销',
    rules: '规则（Rules）',
    skills: '技能（Skills）',
    subagents: '子代理',
    legacy_workflows: '旧版工作流',
    workflows: '工作流',
    plugins: '插件',
    mcp_tools: 'MCP 工具',
    system_messages: '系统消息',
  };
  const HEADING_LABELS = {
    'Token usage by category': '',
    'Estimated after compaction · updates next turn': '压缩后估算值 · 下一轮回复后更新',
    'Estimated usage (awaiting generation)': '等待模型生成 · 当前为估算值',
  };
  const ROUTED_SUFFIX_RE = /(?:trial|tiered|exp|experimental|preview|canary|shadow|alpha|beta|staging)/i;

  const params = new URLSearchParams(location.search);
  const conversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');
  const openFolds = new Set();
  let activeTab = 'context'; // 'context' | 'quota'
  let workspace = '';
  let report = null;
  let quota = null;
  let quotaRefreshing = false;
  let quotaNotice = '';
  let lastJson = '';
  let lastQuotaKey = '';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    if (n == null || !Number.isFinite(n)) return '—';
    if (n >= 1e6) { const v = n / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (n >= 1e3) return `${(n / 1e3).toFixed(1)}k`;
    return String(n);
  }

  function fmtSec(sec) {
    if (sec == null || !Number.isFinite(sec)) return '—';
    if (sec < 1) return `${Math.round(sec * 1000)}ms`;
    if (sec < 60) return `${sec.toFixed(sec < 10 ? 2 : 1)}s`;
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return `${m}m${s}s`;
  }

  function fmtPct(v) {
    if (v == null || !Number.isFinite(v)) return '—';
    return `${v.toFixed(1)}%`;
  }

  function shortEnum(raw) {
    if (!raw) return '';
    return raw.replace(/^MODEL_PLACEHOLDER_/i, '').replace(/^MODEL_/i, '');
  }

  function shortModel(raw) {
    if (!raw) return '—';
    return raw.replace(/^models\//i, '');
  }

  function quotaTone(pct) {
    if (pct == null || !Number.isFinite(pct)) return '';
    if (pct <= 15) return 'bad';
    if (pct <= 40) return 'warn';
    return 'good';
  }

  function quotaColor(pct) {
    if (pct == null || !Number.isFinite(pct)) return 'var(--dim)';
    if (pct <= 15) return 'var(--c-bad)';
    if (pct <= 40) return 'var(--c-warn)';
    return 'var(--c-good)';
  }

  function fmtResetCountdown(resetAtMs) {
    if (resetAtMs == null || !Number.isFinite(resetAtMs)) return '';
    const diff = resetAtMs - Date.now();
    if (diff <= 0) return '即将重置';
    const totalMin = Math.ceil(diff / 60000);
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    const mins = totalMin % 60;
    if (days > 0) return hours > 0 ? `${days}天${hours}小时后重置` : `${days}天后重置`;
    if (hours > 0) return mins > 0 ? `${hours}小时${mins}分后重置` : `${hours}小时后重置`;
    return `${Math.max(1, mins)}分钟后重置`;
  }

  function fmtResetAbsolute(resetAtMs) {
    if (resetAtMs == null || !Number.isFinite(resetAtMs)) return '';
    const d = new Date(resetAtMs);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function hasQuotaData() {
    return Boolean(quota && quota.available && Array.isArray(quota.pools) && quota.pools.length > 0);
  }

  function findMatchedPool() {
    if (!hasQuotaData()) return null;
    if (quota.matchedPoolId) {
      const hit = quota.pools.find((p) => p.id === quota.matchedPoolId);
      if (hit) return hit;
    }
    return [...quota.pools].sort((a, b) => (a.primary?.remainingPct ?? 101) - (b.primary?.remainingPct ?? 101))[0];
  }

  function renderHeader(r) {
    const latest = r.performance?.latest || null;
    const upstream = latest ? (latest.response_model || latest.requested_model || '') : '';
    const enumRaw = latest?.model_enum || '';
    const enumShort = shortEnum(enumRaw);
    const isSpecialRoute = ROUTED_SUFFIX_RE.test(upstream);

    const routeTip = [
      r.model ? `界面显示：${r.model}` : '',
      latest?.requested_model ? `请求模型：${latest.requested_model}` : '',
      latest?.response_model ? `服务端实际应答：${latest.response_model}` : '',
      enumRaw ? `内部枚举：${enumRaw}${latest?.model_enum_id ? ` (#${latest.model_enum_id})` : ''}` : '',
      latest?.response_id ? `响应 ID：${latest.response_id}` : '',
    ].filter(Boolean).join('\n');

    const upstreamHtml = (upstream || enumShort) ? `
      <div class="upstream-line" title="${esc(routeTip)}">
        ${upstream ? `<span class="upstream-code${isSpecialRoute ? ' routed' : ''}">${esc(shortModel(upstream))}</span>` : ''}
        ${isSpecialRoute ? '<span class="tag warn">灰度/分流</span>' : ''}
        ${enumShort ? `<span class="tag mono">${esc(enumShort)}</span>` : ''}
      </div>` : '';

    return `<div class="header">
      <div class="header-info">
        <div class="model-line"><span class="live on" title="实时同步中"></span><span class="name" title="${esc(r.model)}">${esc(r.model)}</span></div>
        ${upstreamHtml}
      </div>
      <button id="copy" class="ghost-btn" title="复制纯文本报告">复制</button>
    </div>`;
  }

  function renderTabs(r) {
    if (!hasQuotaData()) return '';
    const pool = findMatchedPool();
    const pb = pool?.primary || null;
    const qPct = pb?.remainingPct;
    const qTone = quotaTone(qPct);
    const qDotColor = quotaColor(qPct);
    const qLabel = pb?.exhausted ? '0%' : (qPct != null ? `${qPct.toFixed(0)}%` : '');
    const ctxPct = r.limit_tokens ? `${r.used_pct.toFixed(0)}%` : '';

    return `<div class="tabs" role="tablist">
      <button type="button" class="tab${activeTab === 'context' ? ' active' : ''}" data-tab="context" role="tab">
        <span>当前会话</span>
        ${ctxPct ? `<span class="tab-num num dim">${esc(ctxPct)}</span>` : ''}
      </button>
      <button type="button" class="tab${activeTab === 'quota' ? ' active' : ''}" data-tab="quota" role="tab">
        <span class="tab-dot" style="background:${qDotColor}"></span>
        <span>账号额度</span>
        ${qLabel ? `<span class="tab-num num ${qTone}">${esc(qLabel)}</span>` : ''}
      </button>
    </div>`;
  }

  function renderLowQuotaBanner() {
    if (activeTab !== 'context' || !hasQuotaData()) return '';
    const pool = findMatchedPool();
    const pb = pool?.primary || null;
    if (!pb || pb.remainingPct == null || pb.remainingPct > 20) return '';
    const isBad = pb.remainingPct <= 10 || pb.exhausted;
    const cd = fmtResetCountdown(pb.resetAtMs);
    const msg = pb.exhausted
      ? `${pool.title} 额度已耗尽${cd ? ` · ${cd}` : ''}`
      : `${pool.title} 仅剩 ${pb.remainingPct.toFixed(0)}%${cd ? ` · ${cd}` : ''}`;
    return `<div id="quota-alert" class="quota-alert${isBad ? '' : ' warn'}" title="点击切换查看全部账号额度">
      <span class="num ${isBad ? 'bad' : 'warn'}" style="font-weight:600">${esc(msg)}</span>
      <span class="qa-link">查看 ›</span>
    </div>`;
  }

  function renderContextView(r) {
    const limit = r.limit_tokens;
    const budget = r.request_budget_tokens;
    const segs = Array.isArray(r.grid_segments) ? r.grid_segments : [];
    const barSegs = limit > 0 ? segs.map((tok, i) => {
      if (!tok) return '';
      const w = Math.min(100, (tok / limit) * 100);
      const meta = SEGMENT_META[i] || { label: '其他', color: 'var(--dim)' };
      return `<div class="bar-seg" style="width:${w.toFixed(2)}%;background:${meta.color}" title="${esc(meta.label)}：${fmtTok(tok)} tokens (${w.toFixed(1)}%)"></div>`;
    }).join('') : '';

    const hasBudgetLine = Boolean(budget && limit && budget < limit);
    const budgetPos = hasBudgetLine ? Math.min(99, Math.max(1, (budget / limit) * 100)) : 0;
    const budgetPct = budget > 0 ? (r.used_tokens / budget) * 100 : 0;
    const budgetTone = budgetPct >= 95 ? 'bad' : (budgetPct >= 80 ? 'warn' : '');
    const markerHtml = hasBudgetLine
      ? `<div class="budget-marker" style="left:${budgetPos.toFixed(1)}%" title="自动压缩预算线：${fmtTok(budget)} tokens（当前已达预算 ${budgetPct.toFixed(1)}%）"></div>`
      : '';
    const budgetText = hasBudgetLine
      ? `<span class="num ${budgetTone}">压缩线 ${budgetPct.toFixed(1)}% <span class="dim">(${fmtTok(budget)})</span></span>`
      : (budget > 0 ? `<span class="num">预算 ${fmtTok(budget)}</span>` : '<span>实时上下文窗口</span>');
    const freeText = limit > 0 ? `<span class="num">剩余 ${fmtTok(r.free_tokens)}</span>` : '';

    const heroHtml = `<div class="hero-block">
      <div class="hero-usage">
        <div class="hero-nums">
          <span class="hero-big num">${fmtTok(r.used_tokens)}</span>
          <span class="hero-of num">/ ${limit ? fmtTok(limit) : '未知'}</span>
        </div>
        ${limit ? `<span class="hero-pct num">${r.used_pct.toFixed(1)}%</span>` : ''}
      </div>
      <div class="bar-wrap">
        <div class="bar">${barSegs}</div>
        ${markerHtml}
      </div>
      <div class="bar-meta">${budgetText}${freeText}</div>
    </div>`;

    return [
      renderLowQuotaBanner(),
      heroHtml,
      renderKpis(r),
      renderRouting(r),
      renderCategories(r),
      renderTurnsFold(r),
      renderCheckpoints(r),
      renderFilesFold(r),
    ].filter(Boolean).join('');
  }

  function renderKpis(r) {
    const perf = r.performance;
    if (!perf || !perf.latest) return '';
    const l = perf.latest;
    const s = perf.session || {};
    const turns = perf.turn_count || 0;

    const cacheTone = l.cache_drop ? 'bad' : (l.cache_hit_pct != null && l.cache_hit_pct >= 80 ? 'good' : '');
    const cacheBadge = l.cache_drop ? '<span class="tag bad">断裂</span>' : '<span>本轮</span>';
    const cacheSub = turns > 1
      ? `累计 ${fmtPct(s.cache_hit_pct)} · 省 ${fmtTok(s.cache_read_tokens)}`
      : `命中 ${fmtTok(l.cache_read_tokens)} · 新 ${fmtTok(l.input_tokens)}`;
    const cacheTip = `本轮缓存读取 ${fmtTok(l.cache_read_tokens)} / 输入总计 ${fmtTok(l.total_input_tokens)}（新增 ${fmtTok(l.input_tokens)}）`
      + (turns > 1 ? `\n会话累计缓存命中 ${fmtTok(s.cache_read_tokens)} / ${fmtTok(s.total_input_tokens)}（${fmtPct(s.cache_hit_pct)}）` : '')
      + (s.cache_drop_count ? `\n本会话共发生 ${s.cache_drop_count} 次缓存命中骤降` : '');

    const speedVal = l.tps != null ? `${l.tps.toFixed(1)}<span class="unit">tok/s</span>` : '—';
    const speedSub = turns > 1 && s.avg_tps != null
      ? `会话均速 ${s.avg_tps.toFixed(1)} tok/s`
      : (l.effective_tps != null ? `含等待 ${l.effective_tps.toFixed(1)} tok/s` : '流式输出速度');
    const speedTip = `本轮流式速度：${l.tps != null ? `${l.tps.toFixed(1)} tok/s` : '—'}（${fmtTok(l.output_tokens)} tokens / ${fmtSec(l.streaming_sec)}）`
      + (l.effective_tps != null ? `\n含首字等待均速：${l.effective_tps.toFixed(1)} tok/s` : '')
      + (turns > 1 && s.avg_tps != null ? `\n会话平均速度：${s.avg_tps.toFixed(1)} tok/s` : '');

    const ttftSub = l.total_sec != null
      ? `总耗时 ${fmtSec(l.total_sec)}${turns > 1 && s.avg_ttft_sec != null ? ` · 均 ${fmtSec(s.avg_ttft_sec)}` : ''}`
      : (turns > 1 && s.avg_ttft_sec != null ? `会话平均 ${fmtSec(s.avg_ttft_sec)}` : '—');
    const ttftTip = `本轮首字延迟（TTFT）：${fmtSec(l.ttft_sec)}\n流式输出耗时：${fmtSec(l.streaming_sec)}\n本轮总耗时：${fmtSec(l.total_sec)}`
      + (turns > 1 && s.avg_ttft_sec != null ? `\n会话平均 TTFT：${fmtSec(s.avg_ttft_sec)}（共 ${turns} 次调用）` : '');

    const thinkPct = l.thinking_pct != null ? l.thinking_pct : 0;
    const thinkVal = l.thinking_pct != null ? fmtPct(l.thinking_pct) : fmtTok(l.output_tokens);
    const respPct = l.output_tokens > 0 ? Math.max(0, 100 - thinkPct) : 0;
    const thinkSub = (l.thinking_tokens || l.response_tokens)
      ? `思 ${fmtTok(l.thinking_tokens)} · 回 ${fmtTok(l.response_tokens)}`
      : `本轮 ${fmtTok(l.output_tokens)} · 累计 ${fmtTok(s.output_tokens)}`;
    const thinkTip = `本轮输出：${fmtTok(l.output_tokens)} tokens（思考 ${fmtTok(l.thinking_tokens)} / 回复 ${fmtTok(l.response_tokens)}）`
      + (turns > 1 ? `\n会话累计输出：${fmtTok(s.output_tokens)} tokens（思考占 ${fmtPct(s.thinking_pct)}）` : '');

    return `<div class="kpi-grid">
      <div class="kpi-cell" title="${esc(cacheTip)}">
        <div class="kpi-k"><span>缓存命中</span>${cacheBadge}</div>
        <div class="kpi-v num ${cacheTone}">${esc(fmtPct(l.cache_hit_pct))}</div>
        <div class="kpi-sub num">${esc(cacheSub)}</div>
      </div>
      <div class="kpi-cell" title="${esc(speedTip)}">
        <div class="kpi-k"><span>生成速度</span><span>流式</span></div>
        <div class="kpi-v num">${speedVal}</div>
        <div class="kpi-sub num">${esc(speedSub)}</div>
      </div>
      <div class="kpi-cell" title="${esc(ttftTip)}">
        <div class="kpi-k"><span>首字延迟</span><span>TTFT</span></div>
        <div class="kpi-v num">${esc(fmtSec(l.ttft_sec))}</div>
        <div class="kpi-sub num">${esc(ttftSub)}</div>
      </div>
      <div class="kpi-cell" title="${esc(thinkTip)}">
        <div class="kpi-k"><span>思考占比</span><span class="num">输出 ${esc(fmtTok(l.output_tokens))}</span></div>
        <div class="kpi-v num">${esc(thinkVal)}</div>
        <div class="mini-bar"><div style="width:${thinkPct.toFixed(1)}%;background:var(--c-think)"></div><div style="width:${respPct.toFixed(1)}%;background:var(--c-agent)"></div></div>
        <div class="kpi-sub num">${esc(thinkSub)}</div>
      </div>
    </div>`;
  }

  function renderRouting(r) {
    const models = r.performance?.models || [];
    if (models.length <= 1) return '';
    const rows = models.map((m) => {
      const isSpecial = ROUTED_SUFFIX_RE.test(m.upstream_model);
      const enumBadge = m.model_enum ? `<span class="tag mono">${esc(shortEnum(m.model_enum))}</span>` : '';
      return `<div class="route-row">
        <div class="route-top">
          <span class="route-model${isSpecial ? ' warn' : ''}" title="${esc(m.display_name || m.upstream_model)}">${esc(shortModel(m.upstream_model))}</span>
          <span style="display:flex;align-items:center;gap:5px;flex:none">${enumBadge}<span class="tag num">${m.turns} 次</span></span>
        </div>
        <div class="route-sub num">
          <span>命中 ${esc(fmtPct(m.cache_hit_pct))}</span>
          <span>均速 ${m.avg_tps != null ? `${m.avg_tps.toFixed(1)} tok/s` : '—'}</span>
          <span>思考 ${esc(fmtPct(m.thinking_pct))}</span>
          <span>输出 ${esc(fmtTok(m.output_tokens))}</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="sec">
      <div class="sec-head"><span>上游模型分流</span><span class="hint num">${models.length} 个通道</span></div>
      <div class="route-list">${rows}</div>
    </div>`;
  }

  function renderCategories(r) {
    const conv = r.categories.filter((c) => CONVERSATION[c.key]);
    const rest = r.categories.filter((c) => !CONVERSATION[c.key]);
    const limit = r.limit_tokens;
    const freePct = limit ? (r.free_tokens / limit * 100).toFixed(1) : '0.0';
    const rowHtml = (c) => {
      const color = CONVERSATION[c.key] || (SYSTEM.has(c.key) ? 'var(--c-system)' : 'var(--c-custom)');
      const shape = CONVERSATION[c.key] ? '' : ' sq';
      const label = CATEGORY_LABELS[c.key] || c.name;
      return `<div class="cat-row"><span class="mark${shape}" style="background:${color}"></span>`
        + `<span class="cat-name">${esc(label)}</span>`
        + `<span class="cat-tok num">${fmtTok(c.tokens)}</span>`
        + `<span class="cat-pct num">${c.pct.toFixed(1)}%</span></div>`;
    };
    const freeRow = `<div class="cat-row"><span class="mark free"></span><span class="cat-name dim">剩余空间</span>`
      + `<span class="cat-tok num dim">${fmtTok(r.free_tokens)}</span><span class="cat-pct num">${freePct}%</span></div>`;
    const headingText = Object.prototype.hasOwnProperty.call(HEADING_LABELS, r.heading) ? HEADING_LABELS[r.heading] : r.heading;
    const note = headingText ? `<p class="note">${esc(headingText)}</p>` : '';
    const buffer = r.checkpoint_buffer
      ? `<p class="note" style="margin-top:6px;margin-bottom:0">检查点缓存：${fmtTok(r.checkpoint_buffer)} tokens（不计入当前占用）</p>` : '';
    return `<div class="sec">
      <div class="sec-head"><span>上下文构成</span><span class="hint num">${fmtTok(r.used_tokens)} tokens</span></div>
      ${note}
      <div class="cat-group">${conv.map(rowHtml).join('')}</div>
      ${rest.length ? `<div class="cat-group">${rest.map(rowHtml).join('')}</div>` : ''}
      <div class="cat-group">${freeRow}</div>
      ${buffer}
    </div>`;
  }

  function renderTurnsFold(r) {
    const perf = r.performance;
    if (!perf || !perf.recent_turns || !perf.recent_turns.length) return '';
    const drops = perf.session?.cache_drop_count || 0;
    const dropBadge = drops > 0 ? `<span class="tag bad num">${drops} 次断裂</span>` : '';
    const rows = perf.recent_turns.map((t) => {
      const modelShort = shortModel(t.response_model || t.requested_model || t.model_enum || '—');
      const cacheTone = t.cache_drop ? 'bad' : (t.cache_hit_pct != null && t.cache_hit_pct >= 80 ? 'good' : '');
      const tip = `第 #${t.index} 次调用\n上游模型：${modelShort}${t.model_enum ? ` (${t.model_enum})` : ''}`
        + `\n输入：新增 ${fmtTok(t.input_tokens)} + 缓存 ${fmtTok(t.cache_read_tokens)}（命中 ${fmtPct(t.cache_hit_pct)}）`
        + `\n输出：${fmtTok(t.output_tokens)}（思 ${fmtTok(t.thinking_tokens)} / 回 ${fmtTok(t.response_tokens)}）`
        + `\n耗时：TTFT ${fmtSec(t.ttft_sec)} + 流式 ${fmtSec(t.streaming_sec)} = ${fmtSec(t.total_sec)}`
        + (t.response_id ? `\n响应 ID：${t.response_id}` : '');
      return `<div class="turn-row${t.cache_drop ? ' drop' : ''}" title="${esc(tip)}">
        <span class="dim num">#${t.index}</span>
        <span class="t-model">${esc(modelShort)}</span>
        <span class="r num ${cacheTone}">${esc(fmtPct(t.cache_hit_pct))}</span>
        <span class="r num dim">${esc(fmtSec(t.ttft_sec))}</span>
        <span class="r num">${t.tps != null ? `${t.tps.toFixed(0)}/s` : '—'}</span>
      </div>`;
    }).join('');
    const isOpen = openFolds.has('turns') ? ' open' : '';
    return `<details class="fold" data-fold="turns"${isOpen}>
      <summary>
        <span class="sum-left"><span class="chev"></span><span>调用流水</span></span>
        <span class="sum-right">${dropBadge}<span class="num">共 ${perf.turn_count} 次</span></span>
      </summary>
      <div class="fold-body">
        <div class="turns">
          <div class="turn-head"><span>#</span><span>上游模型</span><span class="r">命中</span><span class="r">TTFT</span><span class="r">速度</span></div>
          ${rows}
        </div>
      </div>
    </details>`;
  }

  function renderCheckpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="ck-sub">另有 ${ck.historical} 个历史检查点已摘要归档（不在当前上下文中）</div>` : '';
    return `<div class="sec">
      <div class="sec-head"><span>检查点</span><span class="hint num">${ck.count} 个 · /rewind</span></div>
      <div class="ck-main"><span>#${ck.active_number}：${esc(ck.active_text)}</span><span class="tag good">生效中</span></div>
      ${older}
    </div>`;
  }

  function splitPath(path) {
    const trimmed = path.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (path.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    if (conversationId) dir = dir.replace(new RegExp(`^.*/brain/${conversationId}`), '当前会话目录');
    return { name, dir };
  }

  function renderFilesFold(r) {
    const groups = [
      { title: '知识文件', hint: '/rules', items: r.knowledge_files || [] },
      { title: '产物文件', hint: '/artifact', items: r.artifact_files || [] },
      { title: '技能文件', hint: '/skill', items: r.skill_files || [] },
      { title: '系统自动加载', hint: '自动加载', items: r.system_files || [] },
    ].filter((g) => g.items.length > 0);
    if (!groups.length) return '';
    const totalFiles = groups.reduce((acc, g) => acc + g.items.length, 0);
    const body = groups.map((g) => {
      const rows = g.items.map((f) => {
        const { name, dir } = splitPath(f.path);
        return `<li title="${esc(f.path)}"><span class="fname">${esc(name)}<span class="fdir">‎${esc(dir)}</span></span>`
          + `<span class="ftok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
      }).join('');
      return `<div class="file-group">
        <div class="file-group-title"><span>${esc(g.title)}</span><span class="dim">${esc(g.hint)}</span></div>
        <ul class="files">${rows}</ul>
      </div>`;
    }).join('');
    const isOpen = openFolds.has('files') ? ' open' : '';
    return `<details class="fold" data-fold="files"${isOpen}>
      <summary>
        <span class="sum-left"><span class="chev"></span><span>关联文件</span></span>
        <span class="sum-right num">${totalFiles} 项</span>
      </summary>
      <div class="fold-body">${body}</div>
    </details>`;
  }

  function renderQuotaView() {
    if (!hasQuotaData()) {
      return '<p class="empty">当前账号未返回可用额度数据。</p>';
    }
    const primaryPool = findMatchedPool();
    const pb = primaryPool.primary || primaryPool.buckets?.[0] || null;
    const pctVal = pb?.remainingPct;
    const tone = quotaTone(pctVal);
    const fill = quotaColor(pctVal);
    const heroState = tone === 'bad' ? ' bad' : (tone === 'warn' ? ' warn' : '');
    const cd = fmtResetCountdown(pb?.resetAtMs);
    const abs = fmtResetAbsolute(pb?.resetAtMs);
    const btnLabel = quotaRefreshing ? '刷新中…' : (quotaNotice || '刷新额度');
    const fetchedTime = quota.fetchedAt
      ? new Date(quota.fetchedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      : '';

    const bucketsHtml = (primaryPool.buckets || []).length > 1
      ? `<div class="q-buckets">${primaryPool.buckets.map((b) => {
          const v = b.remainingPct;
          const bTone = quotaTone(v);
          const bFill = quotaColor(v);
          const bCd = fmtResetCountdown(b.resetAtMs);
          const bAbs = fmtResetAbsolute(b.resetAtMs);
          return `<div class="q-bucket-row" title="${esc(bAbs ? `预计 ${bAbs} 重置` : '')}">
            <div class="q-bucket-top num">
              <span>${esc(b.windowLabel || '窗口')} <strong class="${bTone}">${b.exhausted ? '已耗尽' : (v != null ? `${v.toFixed(0)}%` : '—')}</strong></span>
              <span class="dim">${esc(bCd || bAbs || '')}</span>
            </div>
            <div class="q-bucket-bar"><div style="width:${v != null ? Math.max(0, Math.min(100, v)).toFixed(1) : 0}%;background:${bFill}"></div></div>
          </div>`;
        }).join('')}</div>`
      : '';

    const others = quota.pools.filter((p) => p.id !== primaryPool.id);
    const othersHtml = others.length ? `<div class="sec">
      <div class="sec-head"><span>其他额度池</span><span class="hint num">${others.length} 个</span></div>
      <div class="q-other-list">${others.map((p) => {
        const b = p.primary || p.buckets?.[0] || null;
        const v = b?.remainingPct;
        const t = quotaTone(v);
        const f = quotaColor(v);
        const pCd = fmtResetCountdown(b?.resetAtMs);
        const pAbs = fmtResetAbsolute(b?.resetAtMs);
        const extraWin = (p.buckets || []).filter((x) => b && x.id !== b.id)
          .map((x) => `${x.windowLabel || '其他'} ${x.remainingPct != null ? `${x.remainingPct.toFixed(0)}%` : '—'}`).join(' · ');
        return `<div class="q-pool-row" title="${esc(pAbs ? `${p.title} · 预计 ${pAbs} 重置` : p.title)}">
          <div class="q-pool-top">
            <span class="q-pool-name">
              <span>${esc(p.title)}</span>
              ${b?.windowLabel ? `<span class="tag">${esc(b.windowLabel)}</span>` : ''}
            </span>
            <span class="q-pool-pct num ${t}">${b?.exhausted ? '已耗尽' : (v != null ? `${v.toFixed(0)}%` : '—')}</span>
          </div>
          <div class="q-pool-bar"><div style="width:${v != null ? Math.max(0, Math.min(100, v)).toFixed(1) : 0}%;background:${f}"></div></div>
          <div class="q-pool-sub num">
            <span>${esc(pCd || (pAbs ? `${pAbs} 重置` : '未提供重置时间'))}</span>
            <span>${esc(extraWin || pAbs || '')}</span>
          </div>
        </div>`;
      }).join('')}</div>
    </div>` : '';

    return `
      <div class="q-toolbar">
        <div class="q-toolbar-left">
          ${quota.planName ? `<span class="tag">${esc(quota.planName)}</span>` : ''}
          <span class="num">${fetchedTime ? `上次更新 ${esc(fetchedTime)}` : '每 5 分钟自动更新'}</span>
        </div>
        <button id="refresh-quota" class="ghost-btn" type="button"${quotaRefreshing ? ' disabled' : ''}>${esc(btnLabel)}</button>
      </div>
      <div class="q-hero${heroState}">
        <div class="q-hero-top">
          <span class="q-hero-name" title="${esc(primaryPool.title)}">${esc(primaryPool.title)}</span>
          <span style="display:flex;align-items:center;gap:5px;flex:none">
            <span class="tag good">当前模型</span>
            ${pb?.windowLabel ? `<span class="tag">${esc(pb.windowLabel)}</span>` : ''}
          </span>
        </div>
        <div class="q-hero-num-row">
          <span class="q-hero-big num ${tone}">${pb?.exhausted ? '0%' : (pctVal != null ? `${pctVal.toFixed(0)}%` : '—')}</span>
          ${(cd || abs) ? `<span class="q-reset-pill num ${tone === 'bad' ? 'bad' : (tone === 'warn' ? 'warn' : '')}" title="${esc(abs ? `预计重置时间：${abs}` : '')}">${esc(cd || `${abs} 重置`)}</span>` : ''}
        </div>
        <div class="q-hero-bar"><div style="width:${pctVal != null ? Math.max(0, Math.min(100, pctVal)).toFixed(1) : 0}%;background:${fill}"></div></div>
        ${abs && (primaryPool.buckets || []).length <= 1 ? `<div class="bar-meta" style="margin-top:6px"><span>预计重置时间</span><span class="num">${esc(abs)}</span></div>` : ''}
        ${bucketsHtml}
      </div>
      ${othersHtml}
    `;
  }

  function render(r) {
    if (activeTab === 'quota' && !hasQuotaData()) {
      activeTab = 'context';
    }
    const bodyHtml = activeTab === 'quota' ? renderQuotaView() : renderContextView(r);
    main.innerHTML = [
      renderHeader(r),
      renderTabs(r),
      bodyHtml,
      `<footer><span>/artifact · /skill · /rewind</span><span class="num">更新于 ${esc(new Date(r.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }))}</span></footer>`,
    ].filter(Boolean).join('');

    const copyBtn = document.getElementById('copy');
    if (copyBtn) copyBtn.addEventListener('click', copy);
    const refreshQuotaBtn = document.getElementById('refresh-quota');
    if (refreshQuotaBtn) refreshQuotaBtn.addEventListener('click', () => fetchQuota(true));
    const quotaAlert = document.getElementById('quota-alert');
    if (quotaAlert) {
      quotaAlert.addEventListener('click', () => { activeTab = 'quota'; render(r); });
    }
    main.querySelectorAll('.tab[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-tab');
        if (next && next !== activeTab) {
          activeTab = next;
          render(r);
        }
      });
    });
    main.querySelectorAll('details[data-fold]').forEach((el) => {
      el.addEventListener('toggle', () => {
        const key = el.getAttribute('data-fold');
        if (el.open) openFolds.add(key);
        else openFolds.delete(key);
      });
    });
  }

  function showMessage(text) {
    report = null;
    lastJson = '';
    main.innerHTML = `<p class="empty">${esc(text)}</p>`;
  }

  async function copy(event) {
    if (!report) return;
    const p = report.performance;
    let extra = '';
    if (p && p.latest) {
      const l = p.latest;
      const s = p.session || {};
      const up = l.response_model || l.requested_model || '';
      extra = `\n\n上游与性能（共 ${p.turn_count} 次调用）\n`
        + (up ? ` └ 上游模型：${up}${l.model_enum ? ` (${l.model_enum})` : ''}\n` : '')
        + ` └ 缓存命中：本轮 ${fmtPct(l.cache_hit_pct)}（会话累计 ${fmtPct(s.cache_hit_pct)}，省 ${fmtTok(s.cache_read_tokens)}）\n`
        + ` └ 生成速度：本轮 ${l.tps != null ? `${l.tps.toFixed(1)} tok/s` : '—'}（会话均速 ${s.avg_tps != null ? `${s.avg_tps.toFixed(1)} tok/s` : '—'}）\n`
        + ` └ 延迟与思考：TTFT ${fmtSec(l.ttft_sec)} · 总耗时 ${fmtSec(l.total_sec)} · 思考占比 ${fmtPct(l.thinking_pct)}`;
    }
    const text = report.text + extra;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const btn = event.currentTarget;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }

  async function fetchQuota(force = false) {
    if (quotaRefreshing) return;
    if (force) {
      quotaRefreshing = true;
      quotaNotice = '';
      if (report) render(report);
    }
    try {
      const qs = new URLSearchParams();
      if (force) qs.set('force', '1');
      if (report?.model_id) qs.set('modelId', report.model_id);
      if (report?.model) qs.set('displayName', report.model);
      const res = await doFetch(`/api/quota?${qs}`);
      const data = await res.json();
      quota = data && typeof data === 'object' ? data : null;
      if (force && data?.throttled) {
        quotaNotice = '15秒内已刷新';
        setTimeout(() => { quotaNotice = ''; if (report) render(report); }, 1800);
      }
      const qKey = JSON.stringify(quota);
      if (report && (force || qKey !== lastQuotaKey)) {
        lastQuotaKey = qKey;
        render(report);
      }
    } catch {
      /* 额度拉取失败时静默降级，不影响上下文主界面 */
    } finally {
      if (force) {
        quotaRefreshing = false;
        if (report) render(report);
      }
    }
  }

  async function refresh() {
    if (document.hidden) return;
    try {
      const qs = new URLSearchParams({ conversationId, workspace });
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();
      if (data.error === 'no-conversation') return showMessage('打开任意对话即可查看上下文占用、上游模型与生成性能。');
      if (data.error === 'no-database') return showMessage('当前对话尚无已保存数据，发送一条消息后即可查看。');
      if (data.error) return showMessage(`无法读取当前对话：${data.message || data.error}`);
      const prevModel = report?.model_id || '';
      const json = JSON.stringify(data);
      if (json === lastJson) return;
      lastJson = json;
      report = data;
      render(data);
      if (!quota || (data.model_id && data.model_id !== prevModel)) {
        fetchQuota(false);
      }
    } catch {
      const dot = document.querySelector('.live');
      if (dot) dot.classList.remove('on');
    }
  }

  document.addEventListener('visibilitychange', refresh);

  async function start() {
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      const uris = await window.sidecar.getWorkspaceUris();
      workspace = uris[0] || '';
      window.sidecar.onWorkspaceChange((next) => {
        if ((next[0] || '') !== workspace) { workspace = next[0] || ''; lastJson = ''; refresh(); }
      });
    }
    await refresh();
    fetchQuota(false);
    setInterval(refresh, POLL_MS);
    setInterval(() => { if (!document.hidden) fetchQuota(false); }, QUOTA_POLL_MS);
  }
  start();
})();
</script>
</body>
</html>
